# Validates the repo on every push and pull request to main:
# unit tests, the no-force check, and the full content check including
# staleness of api/v1 (D16) and online xref warnings (D17).
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Check scripts for force-based commands
        run: ci/check-no-force.sh
      - name: Run tests
        run: python -m pytest -q
      - name: Validate content and generated files
        run: python ci/sync_index.py --check --online
